name: Classic AmigaOS qualification

on:
  workflow_dispatch:
    inputs:
      payload_path:
        description: Path to staged project qualification payload on the self-hosted runner
        required: true
        default: /opt/amiga-qualification/payload
      payload_artifact_url:
        description: Optional GitHub artifact ZIP URL; when set, download and extract the staged payload on the runner
        required: false
        default: ""
      profile:
        description: Qualification contract profile
        required: true
        default: a500-os204
        type: choice
        options:
          - a500-os204
          - a500plus-os2
          - a1200-020-os3

jobs:
  classic:
    # This label intentionally prevents proprietary assets from being requested
    # by GitHub-hosted runners. The runner administrator supplies legal media.
    runs-on: [self-hosted, amiga-classic]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate private runtime assets
        env:
          AMIGA_RUNTIME_KICKSTART_ROM: ${{ secrets.AMIGA_RUNTIME_KICKSTART_ROM }}
          AMIGA_RUNTIME_SYSTEM_DIR: ${{ secrets.AMIGA_RUNTIME_SYSTEM_DIR }}
        run: |
          test -n "$AMIGA_RUNTIME_KICKSTART_ROM"
          test -n "$AMIGA_RUNTIME_SYSTEM_DIR"
          test -f "$AMIGA_RUNTIME_KICKSTART_ROM"
          test -d "$AMIGA_RUNTIME_SYSTEM_DIR"

      - name: Build amiga-runtime
        run: docker build -t amiga-runtime:classic .

      - name: Prepare optional artifact payload
        if: ${{ inputs.payload_artifact_url != '' }}
        env:
          PAYLOAD_ARTIFACT_URL: ${{ inputs.payload_artifact_url }}
          GITHUB_TOKEN: ${{ secrets.CLASSIC_PAYLOAD_TOKEN || github.token }}
        run: |
          rm -rf "$RUNNER_TEMP/amiga-classic-payload"
          mkdir -p "$RUNNER_TEMP/amiga-classic-payload"
          # Cross-repository Actions artifacts may require a token with Actions
          # read access to the source repository. CLASSIC_PAYLOAD_TOKEN is
          # optional for public/same-repository artifacts and must be scoped
          # read-only when configured.
          case "$PAYLOAD_ARTIFACT_URL" in
            https://github.com/Ploos-AS/*/actions/runs/*/artifacts/*|https://api.github.com/repos/Ploos-AS/*/actions/artifacts/*/zip) ;;
            *) echo "payload_artifact_url must be a Ploos-AS GitHub Actions artifact URL" >&2; exit 2 ;;
          esac
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$PAYLOAD_ARTIFACT_URL" -o "$RUNNER_TEMP/amiga-classic-payload.zip"
          unzip -q "$RUNNER_TEMP/amiga-classic-payload.zip" -d "$RUNNER_TEMP/amiga-classic-payload"
          test -f "$RUNNER_TEMP/amiga-classic-payload/build/m3_3_runtime/amiga-runtime.json"
          echo "CLASSIC_PAYLOAD_PATH=$RUNNER_TEMP/amiga-classic-payload/build/m3_3_runtime" >> "$GITHUB_ENV"

      - name: Run project contract
        env:
          AMIGA_RUNTIME_KICKSTART_ROM: ${{ secrets.AMIGA_RUNTIME_KICKSTART_ROM }}
          AMIGA_RUNTIME_SYSTEM_DIR: ${{ secrets.AMIGA_RUNTIME_SYSTEM_DIR }}
          PAYLOAD_PATH: ${{ env.CLASSIC_PAYLOAD_PATH || inputs.payload_path }}
          PROFILE: ${{ inputs.profile }}
        run: |
          test -d "$PAYLOAD_PATH"
          mkdir -p "$PWD/classic-evidence"
          docker run --rm \
            --network host \
            -e AMIGA_RUNTIME_KICKSTART_ROM=/private/kickstart.rom \
            -e AMIGA_RUNTIME_SYSTEM_DIR=/private/system \
            -v "$AMIGA_RUNTIME_KICKSTART_ROM:/private/kickstart.rom:ro" \
            -v "$AMIGA_RUNTIME_SYSTEM_DIR:/private/system:ro" \
            -v "$PAYLOAD_PATH:/work/payload:ro" \
            -v "$PWD/classic-evidence:/work/evidence" \
            amiga-runtime:classic qualify-contract /work/payload --profile "$PROFILE"

      - name: Verify evidence
        run: jq -e '.runtime == "amigaos" and .emulator == "fs-uae" and .status == "PASS"' classic-evidence/result.json

      - name: Sanitize publishable evidence
        if: always()
        env:
          AMIGA_RUNTIME_KICKSTART_ROM: ${{ secrets.AMIGA_RUNTIME_KICKSTART_ROM }}
          AMIGA_RUNTIME_SYSTEM_DIR: ${{ secrets.AMIGA_RUNTIME_SYSTEM_DIR }}
        run: |
          rm -rf publish-evidence
          mkdir -p publish-evidence
          for f in result.json verification.json fs-uae.stdout.log fs-uae.stderr.log RUN-ME.txt classic.fs-uae; do
            if test -f "classic-evidence/$f"; then
              case "$f" in
                classic.fs-uae)
                  # Config contains private host/container paths; publish a redacted copy.
                  sed -e 's#^kickstart_file = .*#kickstart_file = [REDACTED]#' \
                      -e 's#^hard_drive_0 = .*#hard_drive_0 = [REDACTED]#' \
                      -e 's#^hard_drive_1 = .*#hard_drive_1 = [PAYLOAD]#' \
                      "classic-evidence/$f" > "publish-evidence/$f"
                  ;;
                *) cp "classic-evidence/$f" "publish-evidence/$f" ;;
              esac
            fi
          done
          test ! -e publish-evidence/System
          test ! -e publish-evidence/Test
          # Reject proprietary media/archive types and known AmigaOS payload names.
          if find publish-evidence -type f \( \
              -iname '*.rom' -o -iname '*.adf' -o -iname '*.hdf' -o \
              -iname '*.lha' -o -iname '*.iso' -o -iname 'workbench*' -o \
              -iname 'startup-sequence.amiga-runtime-original' \
            \) -print -quit | grep -q .; then
            echo "proprietary-media candidate found in publishable evidence" >&2
            exit 1
          fi
          if grep -R -F "$AMIGA_RUNTIME_SYSTEM_DIR" publish-evidence 2>/dev/null; then
            echo "private AmigaOS system path leaked into publishable evidence" >&2
            exit 1
          fi
          if grep -R -F "$AMIGA_RUNTIME_KICKSTART_ROM" publish-evidence 2>/dev/null; then
            echo "private Kickstart path leaked into publishable evidence" >&2
            exit 1
          fi

      - name: Remove private runtime copies
        if: always()
        run: rm -rf classic-evidence/System classic-evidence/Test

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classic-amigaos-${{ inputs.profile }}-evidence
          path: publish-evidence/
          if-no-files-found: error
