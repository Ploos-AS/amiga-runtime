name: Reusable project qualification

on:
  workflow_call:
    inputs:
      payload_artifact:
        description: Q1 payload artifact containing amiga-runtime.json and program files
        required: true
        type: string
      profile:
        description: Optional amiga-runtime profile override
        required: false
        type: string
        default: ''
      runtime_image:
        description: Immutable amiga-runtime OCI reference (digest or sha-* tag)
        required: true
        type: string
      runner:
        description: Runner label; use self-hosted for classic AmigaOS qualification with local legal assets
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read
  packages: read

jobs:
  qualify:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Require immutable runtime image
        shell: bash
        env:
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
        run: |
          case "$RUNTIME_IMAGE" in
            *@sha256:*|*:sha-*) ;;
            *) echo "runtime_image must be an immutable digest or sha-* tag" >&2; exit 64 ;;
          esac

      - name: Download Q1 payload
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.payload_artifact }}
          path: runtime-input

      - name: Verify project contract
        run: |
          test -s runtime-input/amiga-runtime.json
          jq -e '.schema == 1 and .architecture == "m68k"' runtime-input/amiga-runtime.json >/dev/null

      - name: Pull runtime image
        run: docker pull "${{ inputs.runtime_image }}"

      - name: Prepare redistributable AROS/m68k runtime
        run: |
          mkdir -p runtime-evidence
          docker run --rm \
            -v "$PWD/runtime-evidence:/work/evidence" \
            "$RUNTIME_IMAGE" \
            sh -ec 'prepare-aros > /work/evidence/aros-prepare.log 2>&1'
          test -s runtime-evidence/aros-prepare.log
          grep -Fq 'AROS m68k runtime prepared: PASS' runtime-evidence/aros-prepare.log

      - name: Qualify project payload
        shell: bash
        env:
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
          PROFILE: ${{ inputs.profile }}
        run: |
          mkdir -p runtime-evidence
          args=(qualify-contract /work/input)
          if [ -n "$PROFILE" ]; then
            args+=(--profile "$PROFILE")
          fi
          docker_args=(--rm
            -v "$PWD/runtime-input:/work/input:ro"
            -v "$PWD/runtime-evidence:/work/evidence")
          if [ -n "${AMIGA_RUNTIME_KICKSTART_ROM:-}" ]; then
            test -f "$AMIGA_RUNTIME_KICKSTART_ROM"
            docker_args+=(-v "$AMIGA_RUNTIME_KICKSTART_ROM:/work/assets/kickstart.rom:ro" -e AMIGA_RUNTIME_KICKSTART_ROM=/work/assets/kickstart.rom)
          fi
          if [ -n "${AMIGA_RUNTIME_SYSTEM_DIR:-}" ]; then
            test -d "$AMIGA_RUNTIME_SYSTEM_DIR"
            docker_args+=(-v "$AMIGA_RUNTIME_SYSTEM_DIR:/work/assets/System:ro" -e AMIGA_RUNTIME_SYSTEM_DIR=/work/assets/System)
          fi
          docker run "${docker_args[@]}" "$RUNTIME_IMAGE" "${args[@]}"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amiga-runtime-project-evidence
          path: runtime-evidence/
          if-no-files-found: warn
