name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  m0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository checks
        run: make check
      - name: Build runtime image
        run: docker build -t amiga-runtime:m0 .
      - name: Container self-test
        run: docker run --rm amiga-runtime:m0 self-test
      - name: Profile inventory
        run: docker run --rm amiga-runtime:m0 profiles
