name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository checks
        run: make check
      - name: Build runtime image
        run: docker build -t amiga-runtime:m2 .
      - name: Container self-test
        run: docker run --rm amiga-runtime:m2 self-test
      - name: Profile inventory
        run: docker run --rm amiga-runtime:m2 profiles
      - name: Cache resolved AROS m68k runtime
        id: aros-cache
        uses: actions/cache@v4
        with:
          path: aros-cache
          key: amiga-runtime-aros-index-v2-${{ runner.os }}-${{ hashFiles('runtime/aros/pinned.env', 'bin/prepare-aros') }}
      - name: Acquire AROS m68k runtime from official index
        if: steps.aros-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$PWD/aros-cache" "$PWD/aros-acquisition-diagnostics"
          set -o pipefail
          docker run --rm \
            -v "$PWD/aros-cache:/opt/amiga-runtime/aros" \
            amiga-runtime:m2 prepare-aros \
            2>&1 | tee "$PWD/aros-acquisition-diagnostics/prepare-aros.log"
      - name: Upload AROS acquisition diagnostics
        if: always() && steps.aros-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aros-acquisition-diagnostics
          path: aros-acquisition-diagnostics/
          if-no-files-found: warn
      - name: Verify resolved AROS m68k runtime
        run: |
          test -s aros-cache/aros.iso
          test -s aros-cache/aros-rom.bin
          test -s aros-cache/aros-ext.bin
          test -n "$(find aros-cache/iso-root -type f -ipath '*/s/startup-sequence' -print -quit)"
          test -s aros-cache/manifest.txt
          grep -qx 'acquisition=official-nightly-index' aros-cache/manifest.txt
          grep -qx 'target=amiga-m68k' aros-cache/manifest.txt
          cat aros-cache/manifest.txt
      - name: Qualify AROS guest boot
        run: |
          mkdir -p "$PWD/runtime-evidence"
          docker run --rm \
            -e AMIGA_RUNTIME_BOOT_TIMEOUT=60 \
            -v "$PWD/aros-cache:/opt/amiga-runtime/aros:ro" \
            -v "$PWD/runtime-evidence:/work/evidence" \
            amiga-runtime:m2 qualify-aros-boot a1200-020-aros
          jq -e '.status == "PASS" and .emulator == "fs-uae" and .guest_boot_proven == true' runtime-evidence/result.json
          test "$(cat runtime-evidence/AMIGA_RUNTIME_BOOT_OK)" = "AMIGA_RUNTIME_BOOT_OK"
      - name: Verify result writer
        run: |
          mkdir -p evidence
          python3 lib/write-result.py PASS 0 a1200-020 smoke evidence
          jq -e '.status == "PASS" and .runtime == "aros"' evidence/result.json
          test -s evidence/junit.xml
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amiga-runtime-m2-evidence
          path: |
            evidence/
            runtime-evidence/
            aros-cache/manifest.txt
            aros-cache/archive.sha256
            aros-cache/iso-root-inventory.txt
            aros-cache/startup-sequence-path.txt
